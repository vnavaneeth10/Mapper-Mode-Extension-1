<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-title">Controlled Queue Loader</div>
      <div class="popup-subtitle">Process URLs with controlled concurrency</div>
    </div>

    <!-- URLs Input -->
    <div class="popup-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <label class="popup-label" style="margin:0">URLs (one per line)</label>
        <button id="importBtn" class="popup-button import-small" title="Import URLs from CSV or Excel file">
          ⬆ Import CSV / Excel
        </button>
      </div>
      <!-- hidden file input -->
      <input type="file" id="importFile" accept=".csv,.xlsx,.xls" style="display:none">
      <!-- column picker — shown after file parsed if multiple columns found -->
      <div id="importPicker" style="display:none;margin-bottom:6px;padding:8px;background:#f8f9fa;
           border:1px solid #dee2e6;border-radius:6px;font-size:12px">
        <label style="font-weight:600;display:block;margin-bottom:4px">
          Select the column that contains URLs:
        </label>
        <select id="importColSelect"
          style="width:100%;padding:4px 6px;border:1px solid #ced4da;border-radius:4px;font-size:12px">
        </select>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button id="importConfirm" class="popup-button primary" style="flex:2;padding:5px">Load URLs</button>
          <button id="importCancel"  class="popup-button danger"  style="flex:1;padding:5px">Cancel</button>
        </div>
      </div>
      <textarea
        id="urls"
        class="popup-textarea"
        placeholder="https://example.com/page-1
https://example.com/page-2
— or use ⬆ Import to load from a CSV / Excel file —"></textarea>
    </div>

    <!-- Settings -->
    <div class="popup-section popup-row">
      <div class="popup-field">
        <label class="popup-label">Max concurrent tabs</label>
        <input id="concurrency" type="number" min="1" max="4" class="popup-input-number" />
      </div>
      <label class="popup-toggle">
        <input type="checkbox" id="autoDone" />
        <span>Always mark done on close</span>
      </label>
    </div>

    <!-- Actions -->
    <div class="popup-section popup-actions">
      <button id="start" class="popup-button primary">Start</button>
      <button id="clear" class="popup-button danger">Clear queue</button>
    </div>

    <!-- Status Summary -->
    <div class="popup-section popup-status">
      <div><span>Status</span><strong id="status"></strong></div>
      <div><span>Active</span><strong id="active"></strong></div>
      <div><span>Pending</span><strong id="pending"></strong></div>
      <div><span>Completed</span><strong id="completed"></strong></div>
      <div><span>Failed</span><strong id="failed"></strong></div>
    </div>

    <!-- Export Section -->
    <div class="popup-section popup-export">
      <div class="popup-export-info">
        <span class="popup-label" style="margin:0">Today's session log</span>
        <span id="logCount" class="log-count">0 entries</span>
      </div>
      <div class="popup-export-actions">
        <button id="downloadReport" class="popup-button export">
          ⬇ Download Excel Report
        </button>
        <button id="clearLog" class="popup-button ghost" title="Clear today's log">
          Clear log
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- SheetJS for Excel parse + generate -->
    <script src="xlsx.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
